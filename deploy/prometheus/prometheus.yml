global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Mafutani does not currently expose a Prometheus /metrics endpoint.
  # Add instrumentation/exporter here when available.
  # - job_name: "mafutani"
  #   static_configs:
  #     - targets: ["mafutani:8000"]

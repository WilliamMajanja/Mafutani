[build]
  publish = "web"
  command = "npm run build"
  functions = "netlify/functions"

[[edge_functions]]
  function = "rate-limit"
  path = "/api/*"

# SPA fallback: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The SPA ships unhashed filenames; a stale app.js is a broken app.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

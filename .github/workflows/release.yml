name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests (quick)
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_zero_dependency.py tests/test_api_rate.py -v
      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/mafutani-${{ github.ref_name }}.tar.gz --exclude='.git' --exclude='__pycache__' --exclude='.venv*' --exclude='node_modules' .
          zip -r dist/mafutani-${{ github.ref_name }}.zip . -x '*.git*' -x '*__pycache__*' -x '*.venv*' -x '*node_modules*'
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
